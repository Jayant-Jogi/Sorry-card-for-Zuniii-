<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>For Zuniii 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#170019}
body{overflow-x:hidden;color:#fff;font-family:Arial,sans-serif}
.scene{position:relative;min-height:100vh;overflow:hidden;padding:40px 16px 48px;background:radial-gradient(circle at 18% 28%,rgba(255,0,190,.12),transparent 24%),radial-gradient(circle at 82% 72%,rgba(110,0,180,.14),transparent 28%),linear-gradient(145deg,#150016,#2a002d 48%,#140015)}
.scene:before{content:"";position:absolute;width:520px;height:520px;left:-260px;top:35%;border-radius:50%;background:radial-gradient(circle,rgba(210,0,190,.13),transparent 68%);filter:blur(20px);animation:glow 7s ease-in-out infinite alternate}
.scene:after{content:"";position:absolute;width:500px;height:500px;right:-260px;bottom:-100px;border-radius:50%;background:radial-gradient(circle,rgba(130,0,255,.11),transparent 70%);filter:blur(22px);animation:glow 9s ease-in-out infinite alternate-reverse}
@keyframes glow{from{transform:scale(.85);opacity:.45}to{transform:scale(1.15);opacity:1}}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.p{position:absolute;width:4px;height:4px;border-radius:50%;background:#f9ddff;box-shadow:0 0 6px #fff,0 0 14px #d95cff,0 0 28px rgba(220,70,255,.65);animation:float var(--d) ease-in-out var(--delay) infinite}
@keyframes float{0%{transform:translateY(16px) scale(.55);opacity:.12}50%{transform:translate(var(--x),-22px) scale(1.2);opacity:.95}100%{transform:translateY(16px) scale(.55);opacity:.12}}
.wrap{position:relative;z-index:3;width:min(720px,100%);margin:auto;text-align:center}
.title{font-family:Caveat,cursive;font-size:clamp(43px,8vw,61px);font-weight:500;line-height:1;color:#fff;text-shadow:0 0 7px rgba(255,255,255,.35),0 0 22px rgba(220,100,255,.22);opacity:0;transform:translateY(25px);animation:titleIn .9s cubic-bezier(.2,.8,.2,1) .2s forwards}
@keyframes titleIn{to{opacity:1;transform:translateY(0)}}
.open-screen{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .55s,transform .55s}
.open-screen.hide{opacity:0;transform:scale(.96);pointer-events:none;position:absolute;inset:0}
.envelope{width:210px;height:150px;position:relative;filter:drop-shadow(0 0 22px rgba(255,0,180,.18));animation:envFloat 2.8s ease-in-out infinite}
@keyframes envFloat{50%{transform:translateY(-8px)}}
.env-body{position:absolute;inset:0;background:#fff1fb;border-radius:12px;box-shadow:0 14px 35px rgba(0,0,0,.25)}
.env-flap{position:absolute;left:0;top:0;width:0;height:0;border-left:105px solid transparent;border-right:105px solid transparent;border-top:80px solid #f7cfe9;transform-origin:top center;filter:drop-shadow(0 2px 2px rgba(100,30,70,.1))}
.env-left{position:absolute;left:0;bottom:0;width:0;height:0;border-bottom:78px solid #f5d9ed;border-right:108px solid transparent}
.env-right{position:absolute;right:0;bottom:0;width:0;height:0;border-bottom:78px solid #f5d9ed;border-left:108px solid transparent}
.open-text{font-family:Caveat,cursive;font-size:30px;color:#fff}
.open-btn,.final-btn{border:0;border-radius:999px;color:#fff;background:linear-gradient(90deg,#ff008c,#ff16a3,#e800ff);box-shadow:0 0 22px rgba(255,0,170,.45),0 8px 22px rgba(255,0,170,.25);font-weight:700;cursor:pointer}
.open-btn{padding:15px 34px;font-size:18px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035);box-shadow:0 0 34px rgba(255,0,180,.65),0 8px 25px rgba(255,0,170,.3)}}
.card-stage{display:none;opacity:0;transform:translateY(25px) scale(.96)}
.card-stage.show{display:block;animation:cardIn .9s cubic-bezier(.16,.84,.25,1) forwards}
@keyframes cardIn{to{opacity:1;transform:none}}
.card{position:relative;margin-top:28px;padding:34px 30px 38px;border-radius:38px;background:rgba(255,243,251,.98);box-shadow:0 16px 46px rgba(0,0,0,.32),0 0 28px rgba(255,70,210,.12);overflow:hidden;color:#593448}
.card:before{content:"";position:absolute;top:-110%;left:-55%;width:42%;height:320%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:shine 7s ease-in-out infinite}
@keyframes shine{0%{left:-55%}25%,100%{left:140%}}
.cat{width:190px;height:190px;margin:0 auto 20px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transform:scale(.88);animation:catIn .65s cubic-bezier(.2,.8,.2,1) .35s forwards}
.cat img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes catIn{70%{opacity:1;transform:scale(1.03)}to{opacity:1;transform:scale(1)}}
.message{font-family:Caveat,cursive;font-size:clamp(25px,4.7vw,33px);line-height:1.55;font-weight:500;color:#563446;text-align:center;max-width:650px;margin:auto}
.line{min-height:1.55em;margin-bottom:18px}
.cursor{display:inline-block;width:3px;height:.95em;background:#e50091;margin-left:3px;vertical-align:-.08em;animation:blink .62s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.signature{font-family:Caveat,cursive;font-size:29px;margin-top:2px;opacity:0;transform:translateY(8px);transition:.6s}.signature.show{opacity:1;transform:none}
.final-wrap{margin-top:38px;opacity:0;transform:translateY(18px) scale(.95);transition:opacity .7s,transform .7s}.final-wrap.show{opacity:1;transform:none}
.final-btn{padding:17px 34px;font-size:19px;position:relative}.final-btn:before{content:"";position:absolute;inset:-5px;border-radius:inherit;background:inherit;filter:blur(13px);opacity:.4;z-index:-1;animation:pulse 2s ease-in-out infinite}
.heart{position:fixed;left:50%;top:50%;font-size:28px;pointer-events:none;z-index:20;animation:heartFly 1.3s ease-out forwards}
@keyframes heartFly{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% - 180px)) rotate(var(--rot)) scale(1.2);opacity:0}}
@media(max-width:600px){.scene{padding:34px 15px 44px}.card{padding:30px 18px 34px;border-radius:32px}.cat{width:175px;height:175px}.message{font-size:27px}.envelope{width:190px;height:136px}.env-flap{border-left-width:95px;border-right-width:95px;border-top-width:73px}.env-left{border-right-width:98px}.env-right{border-left-width:98px}}
</style>
</head>
<body>
<div class="scene">
<div class="particles">
<span class="p" style="left:5%;top:22%;--x:10px;--d:5s;--delay:.1s"></span><span class="p" style="left:13%;top:68%;--x:-12px;--d:7s;--delay:1s"></span><span class="p" style="left:24%;top:14%;--x:8px;--d:6s;--delay:2s"></span><span class="p" style="left:34%;top:82%;--x:-9px;--d:8s;--delay:.5s"></span><span class="p" style="left:48%;top:28%;--x:13px;--d:5.5s;--delay:1.5s"></span><span class="p" style="left:59%;top:74%;--x:-14px;--d:7.5s;--delay:3s"></span><span class="p" style="left:69%;top:16%;--x:9px;--d:6.5s;--delay:.8s"></span><span class="p" style="left:78%;top:50%;--x:-10px;--d:8s;--delay:2.4s"></span><span class="p" style="left:89%;top:31%;--x:12px;--d:5.8s;--delay:1.1s"></span><span class="p" style="left:94%;top:78%;--x:-8px;--d:7s;--delay:3.2s"></span>
</div>
<div class="wrap">
<h1 class="title">A little note for you</h1>
<section class="open-screen" id="openScreen">
<div class="envelope"><div class="env-body"></div><div class="env-left"></div><div class="env-right"></div><div class="env-flap"></div></div>
<div class="open-text">For Zuniii 💗</div>
<button class="open-btn" id="openBtn" type="button" onclick="startCard()">Open my sorry 🥺</button>
</section>
<section class="card-stage" id="cardStage">
<div class="card">
<div class="cat"><img src="cat.gif" alt="cute sorry cat"></div>
<div class="message">
<div class="line" id="line1"></div>
<div class="line" id="line2"></div>
<div class="line" id="line3"></div>
<div class="signature" id="signature">— From me, with all my heart 💗</div>
</div>
</div>
<div class="final-wrap" id="finalWrap"><button class="final-btn" id="finalBtn">Please forgive me, Zuniii 🥺💗</button></div>
</section>
</div>
</div>
<script>
const lines=[
"I'm really sorry, Zuniii. I accidentally upset the most precious and adorable person in my life — you. 🥺",
"Please forgive me if I hurt you or wasted even a little of your precious time. I never meant to hurt you. 🥺",
"You mean so much to me, and I'm truly sorry. I hope you can forgive me. 💗"
];
function typeLine(el,text,speed,done){let i=0;el.innerHTML='<span class="cursor"></span>';function tick(){if(i<text.length){el.querySelector('.cursor').insertAdjacentText('beforebegin',text[i++]);setTimeout(tick,speed)}else{const c=el.querySelector('.cursor');if(c)c.remove();setTimeout(done,350)}}tick()}
function startCard(){document.getElementById('openScreen').classList.add('hide');setTimeout(()=>{document.getElementById('openScreen').style.display='none';const stage=document.getElementById('cardStage');stage.classList.add('show');setTimeout(()=>typeLine(document.getElementById('line1'),lines[0],22,()=>typeLine(document.getElementById('line2'),lines[1],22,()=>typeLine(document.getElementById('line3'),lines[2],22,()=>{document.getElementById('signature').classList.add('show');setTimeout(()=>document.getElementById('finalWrap').classList.add('show'),500}))),600)},900)},500)}
document.getElementById('finalBtn').addEventListener('click',()=>{for(let i=0;i<12;i++){const h=document.createElement('span');h.className='heart';h.textContent=i%2?'💗':'💕';h.style.setProperty('--dx',`${(Math.random()-.5)*260}px`);h.style.setProperty('--rot',`${(Math.random()-.5)*45}deg`);h.style.animationDelay=`${Math.random()*.25}s`;document.body.appendChild(h);setTimeout(()=>h.remove(),1700)}});
</script>
</body>
</html>
