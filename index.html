<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Zuniii 💗</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 55%,#420044,#210021 55%,#130014);color:#fff;font-family:Caveat,cursive;overflow:hidden}.p{position:fixed;width:5px;height:5px;border-radius:50%;background:#f6dfff;box-shadow:0 0 12px #fff,0 0 24px #e04cff;animation:f var(--d) ease-in-out infinite;opacity:.7}@keyframes f{50%{transform:translate(var(--x),-25px) scale(1.3);opacity:1}}main{text-align:center;max-width:700px;margin:auto;padding:60px 18px}.title{font-size:58px;font-weight:500;margin:10px 0 70px;text-shadow:0 0 16px #fff;animation:in .9s ease both}.envelope{margin:auto;width:210px;height:150px;position:relative;animation:b 2.5s ease-in-out infinite}.body{position:absolute;inset:0;background:#fff1fb;border-radius:10px}.flap{position:absolute;left:0;top:0;border-left:105px solid transparent;border-right:105px solid transparent;border-top:82px solid #f5cce7;transform-origin:top;animation:flap 2.2s ease-in-out infinite}.l,.r{position:absolute;bottom:0;width:0;height:0}.l{left:0;border-bottom:78px solid #f1d4e8;border-right:108px solid transparent}.r{right:0;border-bottom:78px solid #f1d4e8;border-left:108px solid transparent}@keyframes flap{0%,65%,100%{transform:rotateX(0)}35%,50%{transform:rotateX(18deg)}}@keyframes b{50%{transform:translateY(-8px)}}.for{font-size:38px;margin:35px 0 28px}.open{display:inline-block;text-decoration:none;color:#fff;background:linear-gradient(90deg,#ff008c,#e800ff);padding:18px 45px;border-radius:60px;font:500 30px Caveat,cursive;box-shadow:0 0 35px #ff00b8;animation:p 1.7s infinite}.open:active{transform:scale(.96)}@keyframes p{50%{box-shadow:0 0 55px #ff00c8;transform:scale(1.025)}}@keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@media(max-width:600px){main{padding-top:45px}.title{font-size:48px;margin-bottom:65px}.envelope{transform:scale(.92)}.for{font-size:34px}.open{font-size:27px;padding:16px 35px}}</style></head><body>
